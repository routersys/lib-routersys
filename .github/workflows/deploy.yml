name: Worker をデプロイ

on:
  workflow_dispatch:
    inputs:
      project:
        description: 一覧へ登録するライブラリ名。空欄なら、いまの一覧のままデプロイする
        required: false
        type: string
      operation:
        description: ライブラリ名に対する操作
        required: false
        type: choice
        default: 追加
        options:
          - 追加
          - 削除

permissions:
  contents: write

jobs:
  deploy:
    name: lib.routersys.com の Worker をデプロイ
    runs-on: ubuntu-latest

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 追加するライブラリの公開先を確認
        if: inputs.project != '' && inputs.operation == '追加'
        env:
          PROJECT: ${{ inputs.project }}
        run: curl -fsSI "https://ymm4.routersys.com/${PROJECT}/" > /dev/null

      - name: 一覧を更新
        id: register
        env:
          PROJECT: ${{ inputs.project }}
          OPERATION: ${{ inputs.operation }}
        run: node scripts/register.mjs "$PROJECT" "$OPERATION"

      - name: 振り分けを試験
        run: node worker/test.mjs

      - name: Worker をデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: 一覧の変更をコミット
        if: steps.register.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          OPERATION: ${{ inputs.operation }}
        run: |
          path=worker/projects.js
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="${PROJECT}を${OPERATION}" \
            -f content="$(base64 -w0 "$path")" \
            -f sha="$sha" \
            -f branch=main > /dev/null
